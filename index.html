<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>College Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Auto-recover from PWA cache issues (blank screen when chunks are missing)
      window.addEventListener('error', async function(e) {
        if (e.target && e.target.tagName === 'SCRIPT') {
          console.warn("Script failed to load, clearing site data to recover...");
          
          // 1. Clear CacheStorage
          if ('caches' in window) {
            try {
              const keys = await caches.keys();
              await Promise.all(keys.map(key => caches.delete(key)));
            } catch (err) {
              console.error("Failed to clear caches", err);
            }
          }

          // 2. Unregister Service Workers
          if (window.navigator && navigator.serviceWorker) {
            try {
              const registrations = await navigator.serviceWorker.getRegistrations();
              for (let registration of registrations) {
                await registration.unregister();
              }
            } catch (err) {
              console.error("Failed to unregister SW", err);
            }
          }
          
          // 3. Clear Local/Session storage
          localStorage.clear();
          sessionStorage.clear();
          
          // 4. Force Reload
          window.location.reload(true);
        }
      }, true);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
